<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>League Cooldowns</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c1220;
      color: #edf2fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 760px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 44px);
      letter-spacing: -1.2px;
    }

    .intro {
      color: #aebbd1;
      line-height: 1.6;
      margin: 0 0 32px;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .mode {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 28px;
      border: 1px solid #30435f;
      border-radius: 20px;
      background: #141e30;
      color: inherit;
      text-decoration: none;
    }

    .mode:focus-visible {
      outline: 3px solid #79c6ff;
      outline-offset: 5px;
    }

    .mode-title {
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.5px;
    }

    .description {
      color: #aebbd1;
      line-height: 1.6;
      font-size: 15px;
    }

    .open {
      color: #9dd9ff;
      font-size: 14px;
      font-weight: 600;
      margin-top: auto;
      padding-top: 12px;
    }

    @media (hover: hover) {
      .mode:hover {
        background: #1c2b43;
        border-color: #79c6ff;
      }
    }

    @media (max-width: 520px) {
      nav {
        grid-template-columns: 1fr;
      }

      .mode {
        padding: 22px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>League Cooldowns</h1>

    <nav aria-label="Calculator mode">
      <a class="mode" href="single.html">
        <span class="mode-title">Single</span>
        <span class="description">
          Look up one champion’s cooldowns by level and ability haste.
        </span>
        <span class="open">Open Single →</span>
      </a>

      <a class="mode" href="multiple.html">
        <span class="mode-title">Multiple</span>
        <span class="description">
          Track five champions together, with separate controls
          and summoner spell timers.
        </span>
        <span class="open">Open Multiple →</span>
      </a>
    </nav>
  </main>
</body>
</html>
